      - id: valgrind
        name: Valgrind (GCC)
        entry: >-
          python -c "import os; p = '../c-ci/precommit_matrix.py'; exec(open(p).read() if os.path.exists(p) else __import__('urllib.request').request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" valgrind gcc
        language: python
        pass_filenames: false
      - id: update-shields
        name: Update README Shields (% doc coverage & % test coverage)
        entry: >-
          python -c "import os; p = '../c-ci/precommit_matrix.py'; exec(open(p).read() if os.path.exists(p) else __import__('urllib.request').request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" shields
        language: python
        additional_dependencies: [gcovr]
        pass_filenames: false
